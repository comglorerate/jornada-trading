<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <!-- Fondo redondeado con gradiente -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Línea de tendencia (resplandor) -->
  <polyline points="76,360 168,272 232,316 312,176 412,176"
            fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="46"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Línea de tendencia principal -->
  <polyline points="76,360 168,272 232,316 312,176 412,176"
            fill="none" stroke="white" stroke-width="32"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cabeza de flecha -->
  <polyline points="356,176 412,176 412,232"
            fill="none" stroke="white" stroke-width="32"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Puntos de la línea -->
  <circle cx="168" cy="272" r="14" fill="white"/>
  <circle cx="232" cy="316" r="14" fill="white"/>
  <circle cx="312" cy="176" r="14" fill="white"/>
</svg>
